name: Codestra deploy readiness

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      operation:
        description: Verify, release, stage/certify read-only, or promote a read-only canary
        required: true
        type: choice
        default: verify
        options:
          - verify
          - release
          - deploy-staging-readonly
          - certify-staging-readonly
          - promote-production-readonly
      confirmation:
        description: Fixed confirmation required for deployment operations
        required: false
        type: string
        default: ""
      canary_percent:
        description: Read-only canary percentage; maximum 1
        required: false
        type: string
        default: "1"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  deploy-readiness:
    uses: appolon1908-hue/Infustruction-repo/.github/workflows/reusable-codestra-deploy-readiness.yml@13916e5d3b17145351d771e16a9c4ef45fc82dfc
    with:
      repository_class: service
      run_stack_tests: false
      artifact_strategy: oci
      dockerfile_path: vicidial/docker/Dockerfile
      docker_build_context: .
      runtime_deployable: true
      health_paths: "/health,/ready,/version"
      operation: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'verify' }}
      confirmation: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
      canary_percent: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_percent || '1' }}
