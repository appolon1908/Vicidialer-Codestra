name: Apply PR2 runtime safety review fixes

on:
  push:
    branches:
      - fix/vicidial-r3-dedicated-consolidation-20260827
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vicidial-pr2-runtime-safety-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact foundation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vicidial-r3-dedicated-consolidation-20260827
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Apply fail-closed source corrections
        run: python .github/repair_pr2_runtime_safety.py

      - name: Install bounded test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e 'vicidial[test]'

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_production_vicidial_sync.py \
            vicidial/tests/test_production_readiness.py
          python -m compileall -q scripts tests vicidial/src vicidial/tests
          cmp scripts/canonical_event_client.py scripts/canonical_event_client.py.reference
          cmp scripts/vicidial_sync.py scripts/vicidial_sync.py.candidate

      - name: Remove one-use repair machinery
        run: |
          rm .github/repair_pr2_runtime_safety.py
          rm .github/workflows/pr2-runtime-safety-repair.yml
          rm -f .github/repair-trigger
          git diff --check

      - name: Commit reviewed corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(vicidial): enforce durable events and runtime readiness'
          git push origin HEAD:fix/vicidial-r3-dedicated-consolidation-20260827
