name: Publish Server B source release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact publication confirmation
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_SERVER_B_SOURCE_RELEASE_75F48FFE'
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: 75f48ffe9f4a48f76bc5ed0ecb3dc5770933d98a
      COSIGN_VERSION: v3.1.2
      COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
    steps:
      - name: Check out protected workflow authority
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {fetch-depth: 0}
      - name: Check out exact protected adapter source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {ref: "${{ env.SOURCE_SHA }}", path: exact-source, fetch-depth: 1}
      - name: Verify authority and source
        run: |
          set -Eeuo pipefail
          test "$(git -C exact-source rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          python -m compileall -q exact-source/vicidial/src exact-source/vicidial/scripts
      - name: Build and test deterministic installer-compatible archive
        run: |
          set -Eeuo pipefail
          python -m pip install pytest==8.4.2
          python -m pytest -q vicidial/tests/test_source_release_artifact.py
          mkdir -p dist
          name="codestra-vicidial-adapter-${SOURCE_SHA}.tar.gz"
          python vicidial/scripts/build_source_release.py --source-root exact-source/vicidial --source-sha "$SOURCE_SHA" --builder-sha "$GITHUB_SHA" --output "dist/$name" --metadata dist/source-release-metadata.json
          sha256sum "dist/$name" > "dist/$name.sha256"
      - name: Sign and verify archive
        run: |
          set -Eeuo pipefail
          cosign="$RUNNER_TEMP/cosign"
          curl --fail --location --proto '=https' --tlsv1.2 "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" --output "$cosign"
          echo "${COSIGN_SHA256}  ${cosign}" | sha256sum --check --strict
          chmod 0755 "$cosign"
          archive="dist/codestra-vicidial-adapter-${SOURCE_SHA}.tar.gz"
          "$cosign" sign-blob --yes --bundle dist/source-release.sigstore.json "$archive"
          "$cosign" verify-blob --bundle dist/source-release.sigstore.json --certificate-identity-regexp '^https://github.com/appolon1908-hue/Vicidialer-Codestra/.github/workflows/publish-server-b-source-release.yml@refs/heads/main$' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
      - name: Upload protected source release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-b-source-release-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
