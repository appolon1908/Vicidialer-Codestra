name: VICIdial adapter source validation

on:
  pull_request:
    paths:
      - "campaign_provisioning/**"
      - "config/odoo-realtime-projection-contract.json"
      - "scripts/**"
      - "tests/**"
      - "vicidial/**"
      - "deploy/vicidial-restricted-adapter/**"
      - ".github/workflows/vicidial-adapter-source.yml"
      - ".gitleaksignore"
      - ".gitignore"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean source checkout
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vicidial/pyproject.toml

      - name: Install adapter test dependencies
        run: python -m pip install -e 'vicidial[test]'

      - name: Run complete VICIdial-owned test suites
        env:
          CODESTRA_ADAPTER_STATE: "${{ runner.temp }}/vicidial-adapter-test-state.sqlite3"
        run: python -m pytest -q vicidial/tests tests

      - name: Check out selected source archive payload
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 9ac8ef4840f78ba4ad9b816e4e409298505103ce
          path: exact-source
          persist-credentials: false

      - name: Verify and install the exact selected source archive
        run: |
          test "$(git -C exact-source rev-parse HEAD)" = 9ac8ef4840f78ba4ad9b816e4e409298505103ce
          SOURCE_RELEASE_TEST_ROOT="$PWD/exact-source/vicidial" \
            python -m pytest -q vicidial/tests/test_source_release_artifact.py

      - name: Compile source and canonical runtime scripts
        run: |
          python -m compileall -q \
            campaign_provisioning \
            scripts \
            vicidial/src \
            vicidial/scripts \
            vicidial/tests \
            tests
          python -m py_compile \
            scripts/vicidial_sync.py \
            scripts/canonical_event_client.py

      - name: Validate Git whitespace
        run: git diff --check "${BASE_SHA}..${SOURCE_SHA}"

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/bin-gitleaks"

      - name: Scan candidate tree
        run: |
          "${RUNNER_TEMP}/bin-gitleaks" dir --no-banner --redact --exit-code 1 .

      - name: Scan PR history
        run: |
          "${RUNNER_TEMP}/bin-gitleaks" git --no-banner --redact --exit-code 1 \
            --log-opts="${BASE_SHA}..${SOURCE_SHA}"

      - name: Scan candidate diff
        run: |
          git diff --binary "${BASE_SHA}..${SOURCE_SHA}" -- \
            campaign_provisioning \
            config/odoo-realtime-projection-contract.json \
            scripts \
            tests \
            vicidial \
            deploy/vicidial-restricted-adapter \
            .github/workflows/vicidial-adapter-source.yml \
            .gitleaksignore \
            .gitignore |
            "${RUNNER_TEMP}/bin-gitleaks" stdin --no-banner --redact --exit-code 1

      - name: Reject forbidden artifacts
        run: |
          if git ls-files \
            campaign_provisioning \
            scripts \
            tests \
            vicidial \
            deploy/vicidial-restricted-adapter |
            grep -E '(^|/)(secrets?|runtime|spool|recordings?|backups?|logs?|volumes?|data)/|[.](pem|key|p12|pfx|dump|backup|sqlite3|db|wav|gsm|mp3|ogg)$'
          then
            echo "Forbidden runtime or secret artifact is tracked."
            exit 1
          fi

      - name: Validate safe configuration examples
        run: |
          python - <<'PY'
          from pathlib import Path

          examples = (
              Path("vicidial/config/adapter.env.example"),
              Path("deploy/vicidial-restricted-adapter/adapter.env.example"),
          )
          required_false = {
              "ENABLE_VICIDIAL_WRITES",
              "ENABLE_PROVISIONING",
              "ENABLE_AGENT_SYNC",
              "ENABLE_LEAD_PUBLICATION",
              "ENABLE_LIVE_CALL_CONTROL",
              "ENABLE_IVR_CALLBACKS",
              "ENABLE_IVR_ROUTING",
              "ENABLE_WARM_TRANSFER",
              "ENABLE_PRODUCTION_DIALING",
          }
          for path in examples:
              values = {}
              for raw in path.read_text().splitlines():
                  line = raw.strip()
                  if line and not line.startswith("#") and "=" in line:
                      key, value = line.split("=", 1)
                      values[key] = value
              missing = required_false - values.keys()
              assert not missing, f"{path}: missing {sorted(missing)}"
              assert all(values[key].lower() == "false" for key in required_false)
              assert values.get("CODESTRA_ADAPTER_BACKEND") == "memory"
          PY

      - name: Validate systemd units statically
        run: |
          failed=0
          for unit in \
            vicidial/ops/codestra-vicidial-restricted-adapter.service \
            vicidial/ops/codestra-vicidial-restricted-adapter-health.service \
            vicidial/ops/codestra-vicidial-restricted-adapter-health.timer \
            deploy/vicidial-restricted-adapter/codestra-vicidial-restricted-adapter.service \
            deploy/vicidial-restricted-adapter/codestra-vicidial-restricted-adapter-health.service \
            deploy/vicidial-restricted-adapter/codestra-vicidial-restricted-adapter-health.timer
          do
            diagnostics="$(mktemp)"
            if ! systemd-analyze verify "${unit}" 2>"${diagnostics}"
            then
              sed -E \
                -e '/Command .* is not executable: No such file or directory/d' \
                -e '\|^/lib/systemd/system/|d' \
                -e '\|^/usr/lib/systemd/system/|d' \
                "${diagnostics}" >"${diagnostics}.fatal"
              if test -s "${diagnostics}.fatal"
              then
                cat "${diagnostics}.fatal"
                failed=1
              fi
            fi
            rm -f "${diagnostics}" "${diagnostics}.fatal"
          done
          test "${failed}" -eq 0
