services:
  restricted-adapter:
    image: ${VICIDIAL_ADAPTER_IMAGE:?complete verified GHCR artifact reference required}
    ports:
      - "127.0.0.1:8097:8097"
    networks:
      adapter-ingress:
        ipv4_address: 172.30.97.2
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
      - /run/codestra:rw,noexec,nosuid,nodev,size=4m,uid=10001,gid=10001
    volumes:
      - adapter-state:/var/lib/codestra-vicidial
      - ${VICIDIAL_DB_SOCKET_DIR:?MariaDB socket directory required}:/run/mysqld:ro
    secrets:
      - source: adapter-hmac
        target: adapter-hmac
      - source: vicidial-db
        target: vicidial-db.json
    environment:
      CODESTRA_ADAPTER_BACKEND: mysql
      CODESTRA_ADAPTER_DEPLOYMENT: production-candidate
      CODESTRA_ADAPTER_HMAC_FILE: /run/secrets/adapter-hmac
      CODESTRA_VICIDIAL_DB_FILE: /run/secrets/vicidial-db.json
      AUTHORIZED_PRIVATE_SOURCE_IP: 10.40.0.1
      # Host Apache reaches the loopback-published port through this isolated,
      # fixed Compose gateway; no forwarded client address is trusted.
      AUTHORIZED_CONTAINER_PROXY_IP: 172.30.97.1
      # Canonical application feature-flag names. Keep every external/live
      # capability fail-closed until a separately approved activation change.
      ENABLE_VICIDIAL_WRITES: "false"
      ENABLE_PROVISIONING: "false"
      ENABLE_AGENT_SYNC: "false"
      # Independently enabled only with a protected exact-user policy file.
      ENABLE_AGENT_PROVISIONING: "false"
      ENABLE_LEAD_PUBLICATION: "false"
      ENABLE_LIVE_CALL_CONTROL: "false"
      ENABLE_WARM_TRANSFER: "false"
      ENABLE_IVR_ROUTING: "false"
      ENABLE_IVR_CALLBACKS: "false"
      ENABLE_PRODUCTION_DIALING: "false"
      ENABLE_SMS_DELIVERY: "false"
      ENABLE_EMAIL_DELIVERY: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      ENABLE_AI_ACTIONS: "false"
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 4096

volumes:
  adapter-state:

networks:
  adapter-ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.97.0/29
          gateway: 172.30.97.1

secrets:
  adapter-hmac:
    file: ${CODESTRA_ADAPTER_HMAC_SECRET_FILE:?HMAC secret file required}
  vicidial-db:
    file: ${CODESTRA_VICIDIAL_DB_SECRET_FILE:?database secret file required}
