[build-system]
requires = ["setuptools>=83.0.0,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "codestra-vicidial-adapter"
version = "0.2.0rc1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<2",
  "pydantic>=2.10,<3",
  "PyMySQL>=1.1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.12,<3",
  "pytest>=8,<10",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
